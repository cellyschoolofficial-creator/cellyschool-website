<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Celly's recap | Celly School</title>
<link rel="icon" href="/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1F2A44;--soft:#56607A;--cream:#FAF6E9;--paper:#FFFDF6;--edge:#E4DFCF;--bio:#81A63C;--good:#4E7A1E;--line:#2B3A67}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:Lexend,"Segoe UI",Arial,sans-serif;font-size:20px;line-height:1.55;letter-spacing:.01em}
.wrap{max-width:820px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
header img{width:64px;height:auto}
header .t{font-size:15px;color:var(--soft);text-transform:uppercase;letter-spacing:.12em}
h1{font-size:30px;margin:0 0 6px;line-height:1.25}
.card{background:var(--paper);border:3px solid var(--line);border-radius:22px;padding:20px 22px}
.dots{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;padding:0;list-style:none}
.dots li{border:2px solid var(--edge);border-radius:999px;padding:2px 12px;font-size:15px;background:#fff;color:var(--soft)}
.dots li.now{border-color:var(--line);color:var(--ink);font-weight:600}
.dots li.done{border-color:var(--bio);color:var(--good)}
.video{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000;margin:12px 0}
.video>div,.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}
/* Celly's own controls: the video can't be clicked through to YouTube */
.video .shield{position:absolute;inset:0;z-index:2;cursor:pointer;background:transparent}
.video .vcover{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#FAF6E9;text-align:center;padding:12px}
.video .vcover[hidden]{display:none}
.video .vcover img{width:90px;height:auto}
.video .vcover p{margin:0;font-weight:600;font-size:20px}
.vctl{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:-2px 0 4px}
.vctl .btn{font-size:18px;padding:10px 16px}
.vctl .vt{color:var(--soft);font-size:17px;margin-left:auto}
.btn{font:inherit;font-weight:600;font-size:21px;border-radius:16px;padding:14px 22px;cursor:pointer;border:3px solid var(--line);background:#fff;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn.go{background:var(--line);color:#fff}
.btn.go.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
.muted{color:var(--soft);font-size:17px}
.plan{margin:10px 0 0;padding-left:24px}
.plan li{margin:6px 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media (max-width:520px){body{font-size:18px}h1{font-size:25px}.btn{font-size:19px;flex:1 1 100%;justify-content:center}}
</style>
</head>
<body>
<div class="wrap">
  <header><img src="/img/celly.png" alt="Celly"><div><div class="t">Celly School</div><b>Celly’s recap</b></div></header>
  <ol class="dots" id="dots" aria-label="Recap steps"></ol>
  <main class="card" id="card" aria-live="polite"></main>
</div>
<script>
(function () {
  var q = new URLSearchParams(location.search), P = null;
  try {
    var b = (q.get('p') || '').replace(/-/g, '+').replace(/_/g, '/'); while (b.length % 4) b += '=';
    P = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b), function (c) { return c.charCodeAt(0); })));
  } catch (e) { P = null; }
  var card = document.getElementById('card'), dots = document.getElementById('dots');
  var ENDPOINT = 'https://script.google.com/macros/s/AKfycbwYsiK2ZrKioF6k0YO_y_m_GhEVFV4ZkxaXX4NvWdqmMY5pcNaCRiwAKmNf4UgOME8DKQ/exec';
  var RK = String(P && P.k ? P.k.slice(0, 12) : 'local').replace(/[^a-z0-9]/gi, '') + '_' + ((P && P.p) || 1);
  function ss(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); sessionStorage.setItem(k, v); } catch (e) { return null; } }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]; }); }
  function track(n, p) { try { if (window.umami) umami.track(n, p); } catch (e) {} }
  if (!P || !/^7[a-l][a-e]?$/.test(P.g || '') || !Array.isArray(P.s) || !P.s.length) {
    card.innerHTML = '<h1>This recap link isn’t complete</h1><p>Please open it again from the email, or <a href="/play/">choose a game</a>.</p>'; return;
  }
  var steps = P.s.filter(function (s) { return (s.c && /^[A-Za-z0-9_-]{11}$/.test(P.v || '')) || s.r >= 0; }).slice(0, 12);
  var at = Math.max(0, Math.min(steps.length, parseInt(q.get('at') || '0', 10) || 0));
  var game = '/play/' + P.g + '/';
  function mins(c) { return Math.max(1, Math.round((c[1] - c[0]) / 60)); }
  function url(k) { var u = new URL(location.href); u.searchParams.set('at', k); return u.toString(); }
  function drawDots() {
    dots.innerHTML = steps.map(function (s, i) {
      return '<li class="' + (i < at ? 'done' : i === at ? 'now' : '') + '">' + (i < at ? '✓ ' : '') + (s.c ? '▶ ' : '🎮 ') + esc(s.n) + '</li>';
    }).join('') + '<li class="' + (at >= steps.length ? 'now' : '') + '">🏆 Done</li>';
  }
  function go(k) { at = k; history.replaceState(null, '', url(k)); drawDots(); show(); window.scrollTo(0, 0); }

  function show() {
    if (at === 0 && !q.get('started')) return intro();
    if (at >= steps.length) return finish();
    var s = steps[at];
    if (s.c) return clip(s); return room(s);
  }
  function intro() {
    var v = steps.filter(function (s) { return s.c; }), r = steps.filter(function (s) { return !s.c; });
    var total = v.reduce(function (a, s) { return a + mins(s.c); }, 0) + r.length * 3;
    var partLbl = P.of > 1 ? '<p class="muted">Recap ' + (P.p || 1) + ' of ' + P.of + '</p>' : '';
    card.innerHTML = partLbl + '<h1>Let’s fix the tricky bits' + (P.c ? ', ' + esc(P.c) : '') + '!</h1><p>Celly picked the parts of the lesson to look at again. Watch a short bit of the video, then play that part of the game.</p>' +
      '<ul class="plan">' + steps.map(function (s) { return '<li>' + (s.c ? '▶ Watch: ' : '🎮 Play: ') + esc(s.n) + (s.c ? ' <span class="muted">(about ' + mins(s.c) + ' min)</span>' : '') + '</li>'; }).join('') + '</ul>' +
      '<p class="muted">About ' + total + ' minutes. You can stop and come back to this link any time.</p>' +
      '<div class="row"><button class="btn go pulse" id="start">Start the recap</button></div>';
    document.getElementById('start').onclick = function () { q.set('started', '1'); track('recap-start', {game: P.g}); go(0); };
  }
  var player = null, apiReady = null;
  function api() {
    if (apiReady) return apiReady;
    apiReady = new Promise(function (res) {
      window.onYouTubeIframeAPIReady = res;
      var t = document.createElement('script'); t.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(t);
    });
    return apiReady;
  }
  function clip(s) {
    card.innerHTML = '<p class="muted">Step ' + (at + 1) + ' of ' + steps.length + '</p><h1>▶ Watch: ' + esc(s.n) + '</h1>' +
      '<p>Watch this part carefully. It is about ' + mins(s.c) + ' minute' + (mins(s.c) > 1 ? 's' : '') + '.</p>' +
      '<div class="video"><div id="yt"></div><div class="shield" id="shield" aria-hidden="true"></div>' +
      '<div class="vcover" id="cover"><img src="/img/celly.png" alt=""><p id="coverTxt">Ready?</p><button class="btn go" id="coverBtn">▶ Play</button></div></div>' +
      '<div class="vctl"><button class="btn" id="pp">⏸ Pause</button><button class="btn" id="back10">⏪ Back 10 seconds</button><button class="btn" id="cc" aria-pressed="false">💬 Subtitles: off</button><span class="vt" id="vt"></span></div>' +
      '<div class="row"><button class="btn" id="again">🔁 Watch it again</button><button class="btn go" id="next">Next ▶</button></div>';
    var cover = document.getElementById('cover'), coverTxt = document.getElementById('coverTxt'), coverBtn = document.getElementById('coverBtn'),
        pp = document.getElementById('pp'), vt = document.getElementById('vt'), ended = false, tick = null;
    function fmt(x) { x = Math.max(0, Math.round(x)); return Math.floor(x / 60) + ':' + ('0' + (x % 60)).slice(-2); }
    function play() { if (!player || !player.playVideo) return; if (ended) { player.seekTo(s.c[0], true); ended = false; } player.playVideo(); }
    function pause() { if (player && player.pauseVideo) player.pauseVideo(); }
    function cov(txt, btn) { coverTxt.textContent = txt; coverBtn.textContent = btn; cover.hidden = false; }
    document.getElementById('next').onclick = function () { clearInterval(tick); track('recap-step', {game: P.g, step: at}); go(at + 1); };
    document.getElementById('shield').onclick = function () { pause(); };
    coverBtn.onclick = function () { play(); };
    pp.onclick = function () { if (player && player.getPlayerState && player.getPlayerState() === 1) pause(); else play(); };
    var ccOn = false, ccB = document.getElementById('cc');
    ccB.onclick = function () { if (!player) return; ccOn = !ccOn;
      try { if (ccOn) { player.loadModule('captions'); player.setOption('captions', 'track', {languageCode: 'en'}); } else player.unloadModule('captions'); } catch (e) {}
      ccB.textContent = '💬 Subtitles: ' + (ccOn ? 'on' : 'off'); ccB.setAttribute('aria-pressed', ccOn ? 'true' : 'false'); };
    document.getElementById('back10').onclick = function () { if (player && player.getCurrentTime) { player.seekTo(Math.max(s.c[0], player.getCurrentTime() - 10), true); play(); } };
    document.getElementById('again').onclick = function () { if (player && player.seekTo) { ended = false; player.seekTo(s.c[0], true); player.playVideo(); } };
    api().then(function () {
      player = new YT.Player('yt', {host: 'https://www.youtube-nocookie.com', videoId: P.v,
        playerVars: {start: s.c[0], end: s.c[1], rel: 0, modestbranding: 1, playsinline: 1, autoplay: 1, cc_load_policy: 0,
          controls: 0, disablekb: 1, fs: 0, iv_load_policy: 3},
        events: {onStateChange: function (e) {
          if (e.data === 1 && !ccOn) { try { player.unloadModule('captions'); } catch (x) {} }
          if (e.data === 1) { cover.hidden = true; pp.textContent = '⏸ Pause'; }
          else if (e.data === 2) { cov('Paused', '▶ Carry on watching'); pp.textContent = '▶ Play'; }
          else if (e.data === 0) { ended = true; cov('✓ Well done! That part is finished.', '🔁 Watch it again'); pp.textContent = '▶ Play';
            var n = document.getElementById('next'); if (n) { n.classList.add('pulse'); n.focus(); } }
        }}});
      tick = setInterval(function () {
        if (!document.getElementById('vt')) return clearInterval(tick);
        if (!player || !player.getCurrentTime) return;
        var now = player.getCurrentTime() - s.c[0]; vt.textContent = fmt(Math.min(now, s.c[1] - s.c[0])) + ' of ' + fmt(s.c[1] - s.c[0]);
      }, 500);
    });
  }
  function room(s) {
    card.innerHTML = '<p class="muted">Step ' + (at + 1) + ' of ' + steps.length + '</p><h1>🎮 Play: ' + esc(s.n) + '</h1>' +
      '<p>Now try this part of the game again. When you finish it, you’ll come straight back here.</p>' +
      '<div class="row"><a class="btn go pulse" id="play">Play ' + esc(s.n) + '</a><button class="btn" id="skip">Skip this one</button></div>';
    document.getElementById('play').href = game + '?room=' + s.r + '&rk=' + RK + '&recap=' + encodeURIComponent(url(at + 1));
    document.getElementById('play').onclick = function () { track('recap-step', {game: P.g, step: at}); };
    document.getElementById('skip').onclick = function () { go(at + 1); };
  }
  function finish() {
    track('recap-done', {game: P.g});
    var res = []; try { res = JSON.parse(ss('cs_rr_' + RK) || '[]'); } catch (e) {}
    var ok = [], still = [];
    res.forEach(function (r) { var good = r.first && r.said !== false; (good ? ok : still).push(r.item); });
    ok = ok.filter(function (x, i) { return ok.indexOf(x) === i && still.indexOf(x) < 0; });
    still = still.filter(function (x, i) { return still.indexOf(x) === i; });
    var g = '7' + P.g.charAt(1).toUpperCase() + P.g.slice(2);
    if (P.k && res.length && !ss('cs_rr_sent_' + RK)) {
      ss('cs_rr_sent_' + RK, '1');
      fetch(ENDPOINT, {method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: JSON.stringify({type: 'recap', k: P.k, child: P.c || '', game: g, video: P.v, title: P.t || '', results: res, n2: P.n2 || []})}).catch(function () { ss('cs_rr_sent_' + RK, ''); });
    }
    var more = still.length || (P.n2 && P.n2.length);
    card.innerHTML = '<h1>🏆 Recap done!</h1><p>Brilliant work. You looked again at the tricky parts. That is exactly how scientists learn.</p>' +
      (ok.length ? '<p><b>Now you’ve got:</b> ' + ok.map(esc).join(', ') + ' ✓</p>' : '') +
      (still.length ? '<p><b>Still a bit tricky:</b> ' + still.map(esc).join(', ') + '. That’s OK. It often clicks after a good sleep.</p>' : '') +
      (more ? '<p>' + (P.k ? 'Your grown-up will get <b>recap 2</b> by email, for tomorrow.' : 'There is a little more to recap tomorrow.') + '</p>' : '<p><b>Everything is secure now!</b></p>') +
      '<div class="row">' + (!P.k && P.n2 && P.n2.length ? '<a class="btn go" id="r2">Recap 2 (tomorrow)</a>' : '') +
      '<a class="btn' + (more ? '' : ' go') + '" href="' + game + '">Play the whole game again</a><a class="btn" href="/' + P.g + '">Back to the lesson</a></div>';
    var r2 = document.getElementById('r2');
    if (r2) {
      var o = {g: P.g, v: P.v, s: P.n2, n2: [], p: 2, of: 2, t: P.t, c: P.c};
      r2.href = '/play/recap/?p=' + btoa(String.fromCharCode.apply(null, new TextEncoder().encode(JSON.stringify(o)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }
  }
  drawDots(); show();
})();
</script>
<script src="/track.js?v=4" defer data-umami="585f0232-f0de-4980-a401-6b8133b6d029" data-clarity="zhgmzz2723" data-posthog="phc_nES5k4NAb39SgFteH7mdCASP4BPWS3vFsJzMTxAB9Vdr" data-ga="G-MZ4TCMRJ72"></script>
</body>
</html>
