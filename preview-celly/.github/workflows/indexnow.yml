name: Tell Bing about new pages (IndexNow)
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the site to update
        run: sleep 120
      - name: Send all sitemap pages to IndexNow
        run: |
          urls=$(grep -o '<loc>[^<]*' sitemap.xml | sed 's/<loc>//' | python3 -c 'import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          body=$(python3 -c "import json,sys;print(json.dumps({'host':'www.cellyschool.com','key':'f2ef7a7101128c35f30dc976826e87d6','keyLocation':'https://www.cellyschool.com/f2ef7a7101128c35f30dc976826e87d6.txt','urlList':json.loads(sys.argv[1])}))" "$urls")
          code=$(curl -s -o /tmp/r.txt -w '%{http_code}' -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "$body")
          echo "IndexNow answered $code"; cat /tmp/r.txt
          case $code in 200|202) exit 0;; *) exit 1;; esac
